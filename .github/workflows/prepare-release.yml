name: Prepare release downloads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-release-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch official Electron assets and verify SHA-256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/cache-electron.mjs
